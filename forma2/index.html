<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
	</head>
	<body>
		<h1>Регистрация</h1>

		<p>Уже есть аккаунт?</p>

		<a href="#">Войти</a>

		<form action="#">
			<div>
				<label for="company"> Введите название компании</label>
				<input
					type="text"
					name="company"
					id="company"
					placeholder="Мой компания"
					required
				/>
			</div>

			<div>
				<label for="name">Введите имя</label>
				<input type="text" name="name" id="name" placeholder="Имя" required />
				<label for="surname">Введите фамилию</label>
				<input type="text" name="surname" id="surname" placeholder="Фамилия" required />
			</div>

			<div>
				<label for="email">Введите E-mail</label>
				<input type="email" name="email" id="email" placeholder="E-mail" required/>
			</div>
			<div>
				<button>Зарегистрироваться</button>
			</div>
			<div>
				<label for="agree">Принять условия</label>
				<input type="checkbox" name="agree" id="agree" required/>
				<p>Я прочитал и принимаю</p>
				<a href="#">Условия использования</a>
			</div>
		</form>
	</body>
</html>
